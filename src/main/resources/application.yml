server:
  port: 8080

  spring:
    application:
      name: inspection

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/inspection?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: username
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: never
      schema-locations: classpath:schema.sql
  servlet:
    multipart:
      max-file-size: 20MB
app:
  jwt:
    secret: jwt-secret
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
  storage:
    local-dir: ./storage

  logging:
    file:
      name: /www/inspection/logs/app.log
    level:
      root: INFO